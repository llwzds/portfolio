<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>

<!-- 封面 -->
<section class="cover">
    <h1>我的作品集</h1>
    <p>向下探索</p>
</section>

<!-- 自我介绍 -->
<section class="about">
    <h2>关于我</h2>
    <div class="card">
        <p>这里写你的介绍</p>
    </div>
</section>

<!-- 分类入口 -->
<section class="menu">
    <h2>我的作品</h2>

    <div class="grid">
        <div class="item" onclick="showContent('photo')">📸 摄影</div>
        <div class="item" onclick="showContent('video')">🎬 视频</div>
        <div class="item" onclick="showContent('media')">📱 运营</div>
        <div class="item" onclick="showContent('writing')">✍️ 文案</div>
    </div>
</section>

<!-- 👇 关键：内容展示区 -->
<section class="content" id="content">

    <div id="photo" class="content-box">
        <h2>摄影作品</h2>
        <img src="{{ url_for('static', filename='images/photo1.jpg') }}">
    </div>

    <div id="video" class="content-box">
        <h2>视频作品</h2>
        <video controls>
            <source src="{{ url_for('static', filename='videos/video1.mp4') }}">
        </video>
    </div>

    <div id="media" class="content-box">
        <h2>运营案例</h2>
        <p>你的运营案例</p>
    </div>

    <div id="writing" class="content-box">
        <h2>文案创作</h2>
        <p>你的文案</p>
    </div>

</section>

<script>
function showContent(id) {

    // 全部隐藏
    let all = document.querySelectorAll(".content-box");
    all.forEach(el => el.style.display = "none");

    // 显示当前
    document.getElementById(id).style.display = "block";

    // 自动滚动到内容区（高级感🔥）
    document.getElementById("content").scrollIntoView({
        behavior: "smooth"
    });
}
</script>

</body>
</html>
